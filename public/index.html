<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VI Rollout · Market inventory</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .intro { max-width: 720px; margin: 8px 0 26px; color: var(--muted); font-size: 16px; }
    .intro h2 { color: var(--ink); margin: 0 0 6px; font-size: 24px; }
    .countries { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .country {
      background: var(--card); border: 0; border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px;
      text-align: left; cursor: pointer; border-top: 4px solid var(--sky-2); display: block; width: 100%;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .country:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(20,40,70,.08), 0 10px 24px rgba(20,40,70,.12); }
    .country.part { border-top-color: var(--cyan); }
    .country.done { border-top-color: var(--green); }
    .country .name { font-size: 24px; font-weight: 800; color: var(--ink); line-height: 1.2; }
    .country .meta { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 14px; font-size: 13px; color: var(--muted); }
    .country .go { margin-top: 14px; font-weight: 700; color: var(--navy); font-size: 14px; }
    .tag { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; background: var(--sky); color: var(--navy); }
    .tag.ok { background: var(--green-bg); color: var(--green); }
    .codebox { max-width: 380px; margin: 60px auto; text-align: left; }
  </style>
</head>
<body>
  <header class="topbar"><div><div class="brand">VI Rollout Strategy</div><h1>Market Inventory</h1></div></header>
  <div id="banner"></div>
  <main id="root"><div class="center">Loading…</div></main>
<script>
const root = document.getElementById('root');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load() {
  const code = sessionStorage.getItem('vi-code') || '';
  let r, data = {};
  try {
    r = await fetch('/api/index?route=countries', { headers: { 'X-Code': code } });
    try { data = await r.json(); } catch (e) { /* non-JSON answer */ }
  } catch (e) {
    root.innerHTML = '<div class="center"><h2>The country list could not be loaded</h2><p>The connection to the server was interrupted. Reloading the page usually helps.</p></div>';
    return;
  }
  if (r.status === 401) return askCode(!!code);
  if (!r.ok) {
    root.innerHTML = `<div class="center"><h2>The country list could not be loaded</h2><p>${esc(data.detail || data.error || ('Status ' + r.status))}</p></div>`;
    return;
  }
  document.getElementById('banner').innerHTML = data.storage === 'memory'
    ? '<div class="banner" style="margin:0;border-radius:0;justify-content:center">Preview mode: answers are kept only temporarily. Connecting the database (Vercel project → Storage → Upstash Redis) makes them permanent and shared between colleagues.</div>' : '';
  root.innerHTML = `<div class="intro"><h2>Select a country</h2>
      Selecting a country opens its inventory: six workstreams and 33 touchpoints, where each touchpoint can be answered by the colleagues who know it best. Answers save automatically and are shared live within the same country.</div>
    <div class="countries">${data.countries.map(c => {
      const pc = Math.round(c.done / c.total * 100);
      const cls = c.done === c.total ? 'done' : c.done > 0 ? 'part' : '';
      return `<button class="country ${cls}" data-href="/m/${esc(c.slug)}?k=${encodeURIComponent(c.key)}" type="button">
        <div class="name">${esc(c.name)}</div>
        <div class="meta"><span>${c.done} of ${c.total} touchpoints · ${pc}%</span><span class="tag">${esc(c.currency)}</span></div>
        <div class="bar"><i style="width:${pc}%"></i></div>
        <div class="go">${c.done ? 'Continue' : 'Open inventory'} →${c.submitted ? ' <span class="tag ok" style="margin-left:8px">submitted</span>' : ''}</div></button>`;
    }).join('')}</div>`;
}

function askCode(wrong) {
  root.innerHTML = `<div class="card codebox"><h2 style="margin-top:0">Access code</h2>
    <p class="hint">The access code shared by the project team opens the country list.${wrong ? ' The code entered was not recognised; another attempt is possible.' : ''}</p>
    <input type="text" id="code" placeholder="Access code" autocomplete="off">
    <div style="margin-top:12px"><button class="btn" id="go" type="button">Continue</button></div></div>`;
  const go = () => { sessionStorage.setItem('vi-code', document.getElementById('code').value.trim()); load(); };
  document.getElementById('go').onclick = go;
  document.getElementById('code').onkeydown = e => { if (e.key === 'Enter') go(); };
  document.getElementById('code').focus();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-href]');
  if (b) location.href = b.dataset.href;
});
load();
</script>
</body>
</html>
