<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VI Rollout · Market inventory</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .gate { max-width: 440px; margin: 70px auto 0; }
    .gate h2 { margin: 0 0 6px; font-size: 24px; }
    .gate .sub { color: var(--muted); margin: 0 0 18px; }
    .gate input { font-size: 17px; letter-spacing: .04em; padding: 12px 14px; }
    .gate .btn { margin-top: 14px; width: 100%; padding: 12px; font-size: 15px; }
    #msg { color: #a33; min-height: 20px; margin-top: 10px; font-size: 14px; }
    .foot { text-align: center; color: var(--muted); font-size: 13px; margin-top: 18px; }
  </style>
</head>
<body>
  <header class="topbar"><div><div class="brand">VI Rollout Strategy</div><h1>Market Inventory</h1></div></header>
  <main>
    <div class="card gate">
      <h2>Access password</h2>
      <p class="sub">Each country has its own password, shared by the project team. The password opens the inventory of that country only.</p>
      <label class="field-label" for="pw">Password</label>
      <input type="password" id="pw" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autofocus>
      <div id="msg" role="alert"></div>
      <button class="btn" id="go" type="button">Open inventory</button>
    </div>
    <div class="foot">Answers are saved automatically and can be completed together with colleagues from the same country.</div>
  </main>
<script>
const pw = document.getElementById('pw'), msg = document.getElementById('msg'), btn = document.getElementById('go');
async function go() {
  if (!pw.value.trim()) { msg.textContent = 'Please enter the password.'; return; }
  btn.disabled = true; msg.textContent = '';
  try {
    const r = await fetch('/api/index?route=unlock', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw.value }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.key && d.slug) { sessionStorage.setItem('k:' + d.slug, d.key); location.href = '/m/' + d.slug; return; }
    msg.textContent = r.status === 429 ? d.error : 'The password was not recognised. Another attempt is possible.';
  } catch (e) { msg.textContent = 'The connection was interrupted. Another attempt is possible.'; }
  btn.disabled = false; pw.select();
}
btn.onclick = go;
pw.onkeydown = e => { if (e.key === 'Enter') go(); };
</script>
</body>
</html>
