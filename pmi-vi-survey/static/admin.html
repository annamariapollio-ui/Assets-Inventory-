<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VI Rollout · Admin overview</title><link rel="stylesheet" href="/static/style.css">
<style>
 table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
 th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
 th{background:var(--sky);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
 .row-actions{display:flex;gap:6px;flex-wrap:wrap}
 .add{display:flex;gap:10px;margin:0 0 20px;flex-wrap:wrap;align-items:end}
 .add > div{min-width:200px}
 .tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;background:var(--sky);color:var(--navy)}
 .tag.ok{background:var(--green-bg);color:var(--green)}
 .files a{display:block;font-size:13px}
</style></head>
<body>
<header class="topbar"><div><div class="brand">VI Rollout Strategy · Market Inventory</div><h1>Admin overview</h1></div></header>
<main>
 <form class="add" id="add"><div><label class="field-label" for="n">New market</label><input type="text" id="n" placeholder="e.g., Switzerland" required></div>
  <div style="min-width:110px"><label class="field-label" for="c">Currency</label><input type="text" id="c" placeholder="CHF" maxlength="6"></div>
  <button class="btn" type="submit">Create market link</button></form>
 <div id="out"><div class="center">Loading…</div></div>
</main>
<script>
const A=new URLSearchParams(location.search).get('a')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function dl(url,name){const r=await fetch(url,{headers:{'X-Admin':A}});if(!r.ok)return alert('Download not available');
 const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download=name;a.click();}
async function load(){
 const r=await fetch('/api/admin/markets',{headers:{'X-Admin':A}});
 if(!r.ok){document.getElementById('out').innerHTML='<div class="center"><h2>Admin key not recognised</h2><p>The admin link printed when the server starts includes the key.</p></div>';return;}
 const {markets}=await r.json();
 if(!markets.length){document.getElementById('out').innerHTML='<div class="center">No markets yet. A first market can be created above.</div>';return;}
 document.getElementById('out').innerHTML=`<table><thead><tr><th>Market</th><th>Progress</th><th>Last activity</th><th>Submissions</th><th>Actions</th></tr></thead><tbody>${
  markets.map(m=>`<tr><td><strong>${esc(m.name)}</strong><br><span class="tag">${esc(m.currency)}</span></td>
   <td>${m.progress.done} / ${m.progress.total} touchpoints<br><span class="tag ${m.ready?'ok':''}">${m.ready?'Ready to submit':'In progress'}</span></td>
   <td>${m.last_activity?new Date(m.last_activity).toLocaleString():'—'}</td>
   <td class="files">${m.submissions.length?m.submissions.slice().reverse().map(s=>`<a href="#" data-f="${esc(s.file)}" data-s="${esc(m.slug)}">${new Date(s.at).toLocaleString()} · ${esc(s.by||'')}</a>`).join(''):'—'}</td>
   <td><div class="row-actions"><button class="btn small" data-copy="${esc(m.link)}">Copy market link</button>
   <button class="btn ghost small" data-draft="${esc(m.slug)}">Current draft (Excel)</button></div></td></tr>`).join('')}</tbody></table>`;
}
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-copy],[data-draft],[data-f]');if(!t)return;e.preventDefault();
 if(t.dataset.copy){try{await navigator.clipboard.writeText(t.dataset.copy);t.textContent='Copied';setTimeout(()=>t.textContent='Copy market link',1500)}catch(x){prompt('Link',t.dataset.copy)}}
 else if(t.dataset.draft)dl('/api/admin/export/'+t.dataset.draft,t.dataset.draft+'_draft.xlsx');
 else dl('/api/admin/file/'+t.dataset.s+'/'+t.dataset.f,t.dataset.f);
});
document.getElementById('add').onsubmit=async e=>{e.preventDefault();
 const r=await fetch('/api/admin/markets',{method:'POST',headers:{'X-Admin':A,'Content-Type':'application/json'},body:JSON.stringify({name:n.value,currency:c.value})});
 if(r.ok){n.value='';c.value='';load();}else alert('Market could not be created');};
load();setInterval(load,15000);
</script></body></html>
